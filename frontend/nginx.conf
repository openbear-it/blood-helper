worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Use /tmp for writable paths when running as non-root
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 3000;
        root /usr/share/nginx/html;
        index index.html;

        # SPA fallback — all routes served by React Router
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API and WebSocket routing is handled by the Traefik ingress controller.
        # These paths are forwarded directly to blood-helper-backend by Traefik
        # at the cluster edge, so no proxy_pass is needed here.
    }
}

name: CI — Tests & Lint

on:
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.12" ]

    services:
      redis:
        image: redis:7-alpine
        ports:
        - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: backend/requirements.txt

    - name: Install dependencies
      working-directory: backend
      run: pip install -r requirements.txt

    - name: Run tests with coverage
      working-directory: backend
      env:
        # Tests use SQLite in-memory via conftest.py fixtures
        DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        DATABASE_URL_SYNC: "sqlite:///./test.db"
        REDIS_URL: "redis://localhost:6379/0"
        CELERY_BROKER_URL: "redis://localhost:6379/0"
        CELERY_RESULT_BACKEND: "redis://localhost:6379/1"
        SECRET_KEY: "test-secret-key-for-ci-only"
      run: pytest -v

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: backend/coverage.xml
        retention-days: 7

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend type-check & lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: frontend
      run: npm ci

    - name: TypeScript type-check
      working-directory: frontend
      run: npx tsc --noEmit

    - name: Build (verifies no compile errors)
      working-directory: frontend
      env:
        # Needed only if Vite uses VITE_API_URL at build time
        VITE_API_URL: "http://localhost:8000"
      run: npm run build

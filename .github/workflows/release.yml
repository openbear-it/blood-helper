name: Release — Build & Push All Images

# Triggered only when a semver tag is pushed (e.g. v1.2.3).
# Builds both backend and frontend in parallel.
on:
  push:
    tags:
    - "v*.*.*"

jobs:
  # ── Backend ───────────────────────────────────────────────────────────────
  build-backend:
    name: Backend — amd64 + arm64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Docker metadata (backend)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/blood-helper-backend
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha,prefix=sha-

    - name: Build and push backend
      uses: docker/build-push-action@v6
      with:
        context: ./backend
        file: ./backend/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ── Frontend ──────────────────────────────────────────────────────────────
  build-frontend:
    name: Frontend — amd64 + arm64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract Docker metadata (frontend)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/blood-helper-frontend
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha,prefix=sha-

    - name: Build and push frontend
      uses: docker/build-push-action@v6
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ── Patch k8s manifests with the new image tags ───────────────────────────
  update-k8s-images:
    name: Patch k8s image tags
    needs: [ build-backend, build-frontend ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract version (strip leading v)
      id: version
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    - name: Update image tags in k8s manifests
      run: |
        VERSION="${{ steps.version.outputs.VERSION }}"
        REGISTRY="ghcr.io/${{ github.repository_owner }}"

        # Backend image (deployment, celery worker, celery beat, migration job)
        sed -i "s|image: .*blood-helper-backend:.*|image: ${REGISTRY}/blood-helper-backend:${VERSION}|g" \
          k8s/backend/deployment.yaml \
          k8s/celery/worker.yaml \
          k8s/celery/beat.yaml \
          k8s/backend/migration-job.yaml

        # Frontend image
        sed -i "s|image: .*blood-helper-frontend:.*|image: ${REGISTRY}/blood-helper-frontend:${VERSION}|g" \
          k8s/frontend/deployment.yaml

    - name: Commit updated manifests
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add k8s/
        git diff --cached --quiet || git commit -m "chore(k8s): bump image tags to ${{ github.ref_name }}"
        git push

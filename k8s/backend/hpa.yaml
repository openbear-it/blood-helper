apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: blood-helper-backend
  namespace: blood-helper
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: blood-helper-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

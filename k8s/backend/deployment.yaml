apiVersion: apps/v1
kind: Deployment
metadata:
  name: blood-helper-backend
  namespace: blood-helper
  labels:
    app: blood-helper-backend
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blood-helper-backend
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: blood-helper-backend
    spec:
      # Ensure the DB is reachable before starting
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z postgres 5432; do
            echo "waiting for postgres..."; sleep 2
          done
      - name: wait-for-redis
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z redis 6379; do
            echo "waiting for redis..."; sleep 2
          done
      containers:
      - name: api
        image: ghcr.io/openbear-it/blood-helper-backend:main
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: blood-helper-config
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: blood-helper-secret
              key: POSTGRES_PASSWORD
        - name: DATABASE_URL
          value: "postgresql+asyncpg://blood-helper:$(POSTGRES_PASSWORD)@postgres:5432/blood-helper"
        - name: DATABASE_URL_SYNC
          value: "postgresql+psycopg2://blood-helper:$(POSTGRES_PASSWORD)@postgres:5432/blood-helper"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: blood-helper-secret
              key: SECRET_KEY
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false

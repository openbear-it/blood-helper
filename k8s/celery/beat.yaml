apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: blood-helper
  labels:
    app: celery-beat
    app.kubernetes.io/component: scheduler
spec:
  # Beat must always run as a single replica to avoid duplicate tasks
  replicas: 1
  selector:
    matchLabels:
      app: celery-beat
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: celery-beat
    spec:
      initContainers:
      - name: wait-for-redis
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z redis 6379; do
            echo "waiting for redis..."; sleep 2
          done
      containers:
      - name: beat
        image: ghcr.io/openbear-it/blood-helper-backend:main
        imagePullPolicy: Always
        command:
        - celery
        - -A
        - app.infrastructure.messaging.celery_app
        - beat
        - --loglevel=info
        - --schedule
        - /beat-data/celerybeat-schedule
        envFrom:
        - configMapRef:
            name: blood-helper-config
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: blood-helper-secret
              key: POSTGRES_PASSWORD
        - name: DATABASE_URL
          value: "postgresql+asyncpg://blood-helper:$(POSTGRES_PASSWORD)@postgres:5432/blood-helper"
        - name: DATABASE_URL_SYNC
          value: "postgresql+psycopg2://blood-helper:$(POSTGRES_PASSWORD)@postgres:5432/blood-helper"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: blood-helper-secret
              key: SECRET_KEY
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
        volumeMounts:
        - name: beat-data
          mountPath: /beat-data
      volumes:
      - name: beat-data
        emptyDir: {}

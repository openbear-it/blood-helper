apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: blood-helper
  labels:
    app: celery-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: celery-worker
    spec:
      initContainers:
      - name: wait-for-redis
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z redis 6379; do
            echo "waiting for redis..."; sleep 2
          done
      - name: wait-for-postgres
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          until nc -z postgres 5432; do
            echo "waiting for postgres..."; sleep 2
          done
      containers:
      - name: worker
        image: ghcr.io/openbear-it/blood-helper-backend:main
        imagePullPolicy: Always
        command:
        - celery
        - -A
        - app.infrastructure.messaging.celery_app
        - worker
        - --loglevel=info
        - --concurrency=2
        envFrom:
        - configMapRef:
            name: blood-helper-config
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: blood-helper-secret
              key: POSTGRES_PASSWORD
        - name: DATABASE_URL
          value: "postgresql+asyncpg://blood-helper:$(POSTGRES_PASSWORD)@postgres:5432/blood-helper"
        - name: DATABASE_URL_SYNC
          value: "postgresql+psycopg2://blood-helper:$(POSTGRES_PASSWORD)@postgres:5432/blood-helper"
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: blood-helper-secret
              key: SECRET_KEY
        resources:
          # Workers run ML inference — they need more memory
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          exec:
            command:
            - celery
            - -A
            - app.infrastructure.messaging.celery_app
            - inspect
            - ping
          initialDelaySeconds: 30
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false

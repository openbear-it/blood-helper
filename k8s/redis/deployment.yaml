apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: blood-helper
  labels:
    app: redis
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        args: [ "--save", "60", "1", "--loglevel", "warning" ]
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 256Mi
        readinessProbe:
          exec:
            command: [ "redis-cli", "ping" ]
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command: [ "redis-cli", "ping" ]
          initialDelaySeconds: 10
          periodSeconds: 15
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: blood-helper
spec:
  accessModes: [ "ReadWriteOnce" ]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi

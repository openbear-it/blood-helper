apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: blood-helper
  labels:
    app: postgres
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  clusterIP: None # headless — required by StatefulSet
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
